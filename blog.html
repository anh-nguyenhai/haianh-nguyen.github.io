<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog - Hai Anh Nguyen</title>
  <meta name="description" content="AI Research & Mathematics Blog - Nguyen Hai Anh">
  <link rel="stylesheet" href="style/main.css">
  <style>
    /* Language Switcher */
    .language-switcher {
      position: absolute;
      top: 15px;
      right: 80px;
      display: flex;
      gap: 5px;
      z-index: 100;
    }

    .lang-btn {
      padding: 5px 12px;
      border: 1px solid #424242;
      background: white;
      color: #424242;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Lora', serif;
      transition: all 0.3s;
    }

    .lang-btn:hover,
    .lang-btn.active {
      background: #424242;
      color: white;
    }

    /* Blog Grid */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      margin-top: 40px;
    }

    .blog-card {
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      background: white;
    }

    .blog-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .blog-card-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .blog-card-content {
      padding: 20px;
    }

    .blog-category {
      display: inline-block;
      padding: 4px 12px;
      background: #f0f0f0;
      color: #666;
      border-radius: 12px;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .blog-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #111;
    }

    .blog-excerpt {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .blog-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #999;
    }

    .blog-date {
      font-style: italic;
    }

    .blog-read-time {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .read-more {
      color: #2a7ae2;
      text-decoration: none;
      font-weight: bold;
    }

    .read-more:hover {
      text-decoration: underline;
    }

    /* Category Filter */
    .category-filter {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      justify-content: center;
    }

    .category-filter-btn {
      padding: 8px 20px;
      border: 2px solid #2a7ae2;
      background: white;
      color: #2a7ae2;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Lora', serif;
      font-size: 14px;
      transition: all 0.3s;
    }

    .category-filter-btn:hover,
    .category-filter-btn.active {
      background: #2a7ae2;
      color: white;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }

    .empty-state-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    /* Mobile Menu Fix */
    @media screen and (max-width: 600px) {
      .language-switcher {
        right: 60px;
        top: 12px;
      }

      .lang-btn {
        padding: 4px 8px;
        font-size: 12px;
      }

      .site-nav .trigger {
        clear: both;
        display: none;
      }

      .site-nav input:checked~.trigger {
        display: block;
        padding-bottom: 5px;
      }

      .site-nav {
        position: absolute;
        top: 9px;
        right: 15px;
        background-color: #fdfdfd;
        border: 1px solid #e8e8e8;
        border-radius: 5px;
        text-align: right;
        z-index: 1000;
      }

      .site-nav label[for="nav-trigger"] {
        display: block;
        float: right;
        width: 36px;
        height: 36px;
        z-index: 1001;
        cursor: pointer;
        position: relative;
      }

      .site-nav .menu-icon {
        display: block;
        float: right;
        width: 36px;
        height: 26px;
        line-height: 0;
        padding-top: 10px;
        text-align: center;
        cursor: pointer;
        pointer-events: auto;
      }

      .site-nav .menu-icon svg {
        pointer-events: none;
      }

      .site-nav .page-link {
        display: block;
        padding: 5px 10px;
        margin-left: 20px;
        position: relative;
        z-index: 1002;
        color: #111;
        text-decoration: none;
      }

      .blog-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="site-header" role="banner">
    <div class="wrapper">
      <a class="site-title" href="/">Hai Anh Nguyen</a>

      <!-- Language Switcher -->
      <div class="language-switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="vi">VI</button>
      </div>

      <nav class="site-nav">
        <input type="checkbox" id="nav-trigger" class="nav-trigger" />
        <label for="nav-trigger">
          <span class="menu-icon">
            <svg viewBox="0 0 18 15" width="18px" height="15px">
              <path fill="#424242"
                d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.031C17.335,0,18,0.665,18,1.484L18,1.484z">
              </path>
              <path fill="#424242"
                d="M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0c0-0.82,0.665-1.484,1.484-1.484 h15.031C17.335,6.031,18,6.696,18,7.516L18,7.516z">
              </path>
              <path fill="#424242"
                d="M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.031C17.335,12.031,18,12.696,18,13.516L18,13.516z">
              </path>
            </svg>
          </span>
        </label>
        <div class="trigger">
          <a class="page-link" href="blog.html">Blog</a>
          <a class="page-link" href="bucket_list.html">List 100</a>
          <a class="page-link" href="vocabulary.html">English Vocabulary</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      <header class="post-header">
        <h1 class="post-title" id="page-title">Blog</h1>
        <p id="page-subtitle" style="color: #666; font-size: 18px;">Mathematics, AI Research, and More</p>
      </header>

      <!-- Category Filter -->
      <div class="category-filter">
        <button class="category-filter-btn active" data-category="all">All</button>
        <button class="category-filter-btn" data-category="mathematics">Mathematics</button>
        <button class="category-filter-btn" data-category="ai">AI & ML</button>
        <button class="category-filter-btn" data-category="research">Research</button>
        <button class="category-filter-btn" data-category="tutorial">Tutorial</button>
      </div>

      <!-- Blog Grid -->
      <div class="blog-grid" id="blog-grid">
        <!-- Sample Posts - Will be populated by JavaScript -->
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="empty-state" style="display: none;">
        <div class="empty-state-icon">📝</div>
        <h2 id="empty-title">Coming Soon!</h2>
        <p id="empty-text">I'm working on exciting content about Mathematics and AI. Stay tuned!</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <h2 class="footer-heading">Nguyen Hai Anh</h2>
      <div class="footer-col-wrapper">
        <div class="footer-col footer-col-1">
          <ul class="contact-list">
            <li><a href="mailto:nguyenhaianh232@gmail.com">nguyenhaianh232@gmail.com</a></li>
            <li><a href="https://github.com/nguyenhaianh-captain">GitHub</a></li>
            <li><a href="https://twitter.com/haianhdz266">Twitter</a></li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

  <script>
    // Sample blog posts data
    const blogPosts = {
      en: [
        {
          id: 1,
          category: 'mathematics',
          title: 'Introduction to Linear Algebra',
          excerpt: 'Understanding the fundamentals of linear algebra: vectors, matrices, and transformations.',
          date: 'Jan 15, 2025',
          readTime: '8 min',
          emoji: '📐',
          slug: 'intro-linear-algebra'
        },
        {
          id: 2,
          category: 'mathematics',
          title: 'Calculus in Machine Learning',
          excerpt: 'How calculus powers gradient descent and optimization algorithms in deep learning.',
          date: 'Jan 10, 2025',
          readTime: '12 min',
          emoji: '∫',
          slug: 'calculus-ml'
        },
        {
          id: 3,
          category: 'ai',
          title: 'Physics-Informed Neural Networks',
          excerpt: 'Exploring how physics constraints can improve neural network predictions for scientific applications.',
          date: 'Dec 28, 2024',
          readTime: '15 min',
          emoji: '🔬',
          slug: 'pinn-intro'
        }
      ],
      vi: [
        {
          id: 1,
          category: 'mathematics',
          title: 'Giới thiệu về Đại số Tuyến tính',
          excerpt: 'Hiểu các khái niệm cơ bản về đại số tuyến tính: vectors, ma trận và phép biến đổi.',
          date: '15 Th1, 2025',
          readTime: '8 phút',
          emoji: '📐',
          slug: 'intro-linear-algebra'
        },
        {
          id: 2,
          category: 'mathematics',
          title: 'Giải tích trong Machine Learning',
          excerpt: 'Giải tích là nền tảng của gradient descent và các thuật toán tối ưu trong deep learning.',
          date: '10 Th1, 2025',
          readTime: '12 phút',
          emoji: '∫',
          slug: 'calculus-ml'
        },
        {
          id: 3,
          category: 'ai',
          title: 'Physics-Informed Neural Networks',
          excerpt: 'Tìm hiểu cách các ràng buộc vật lý cải thiện dự đoán của mạng neural trong khoa học.',
          date: '28 Th12, 2024',
          readTime: '15 phút',
          emoji: '🔬',
          slug: 'pinn-intro'
        }
      ]
    };

    let currentLang = 'en';
    let currentCategory = 'all';

    // Translations
    const translations = {
      en: {
        pageTitle: 'Blog',
        pageSubtitle: 'Mathematics, AI Research, and More',
        emptyTitle: 'Coming Soon!',
        emptyText: "I'm working on exciting content about Mathematics and AI. Stay tuned!",
        all: 'All',
        mathematics: 'Mathematics',
        ai: 'AI & ML',
        research: 'Research',
        tutorial: 'Tutorial'
      },
      vi: {
        pageTitle: 'Blog',
        pageSubtitle: 'Toán học, Nghiên cứu AI, và nhiều hơn nữa',
        emptyTitle: 'Sắp ra mắt!',
        emptyText: 'Tôi đang viết nội dung thú vị về Toán học và AI. Hãy đón chờ nhé!',
        all: 'Tất cả',
        mathematics: 'Toán học',
        ai: 'AI & ML',
        research: 'Nghiên cứu',
        tutorial: 'Hướng dẫn'
      }
    };

    // Language Switcher
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentLang = this.dataset.lang;
        updateContent();
      });
    });

    // Category Filter
    document.querySelectorAll('.category-filter-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.category-filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentCategory = this.dataset.category;
        renderBlogPosts();
      });
    });

    function updateContent() {
      // Update page text
      document.getElementById('page-title').textContent = translations[currentLang].pageTitle;
      document.getElementById('page-subtitle').textContent = translations[currentLang].pageSubtitle;
      document.getElementById('empty-title').textContent = translations[currentLang].emptyTitle;
      document.getElementById('empty-text').textContent = translations[currentLang].emptyText;

      // Update category buttons
      document.querySelectorAll('.category-filter-btn').forEach(btn => {
        const category = btn.dataset.category;
        btn.textContent = translations[currentLang][category];
      });

      renderBlogPosts();
    }

    function renderBlogPosts() {
      const posts = blogPosts[currentLang];
      const filteredPosts = currentCategory === 'all'
        ? posts
        : posts.filter(p => p.category === currentCategory);

      const blogGrid = document.getElementById('blog-grid');
      const emptyState = document.getElementById('empty-state');

      if (filteredPosts.length === 0) {
        blogGrid.style.display = 'none';
        emptyState.style.display = 'block';
      } else {
        blogGrid.style.display = 'grid';
        emptyState.style.display = 'none';

        blogGrid.innerHTML = filteredPosts.map(post => `
          <div class="blog-card">
            <div class="blog-card-image">${post.emoji}</div>
            <div class="blog-card-content">
              <span class="blog-category">${translations[currentLang][post.category]}</span>
              <h2 class="blog-title">${post.title}</h2>
              <p class="blog-excerpt">${post.excerpt}</p>
              <div class="blog-meta">
                <span class="blog-date">${post.date}</span>
                <span class="blog-read-time">📖 ${post.readTime}</span>
              </div>
              <a href="blog-post.html?id=${post.slug}&lang=${currentLang}" class="read-more">
                ${currentLang === 'en' ? 'Read More →' : 'Đọc thêm →'}
              </a>
            </div>
          </div>
        `).join('');
      }
    }

    // Mobile menu toggle
    document.addEventListener('DOMContentLoaded', function () {
      const navTrigger = document.getElementById('nav-trigger');
      const menuIcon = document.querySelector('.menu-icon');
      const trigger = document.querySelector('.site-nav .trigger');

      if (menuIcon && trigger) {
        menuIcon.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          navTrigger.checked = !navTrigger.checked;

          if (navTrigger.checked) {
            trigger.style.display = 'block';
          } else {
            trigger.style.display = '';
          }
        });

        document.addEventListener('click', function (e) {
          if (!e.target.closest('.site-nav')) {
            navTrigger.checked = false;
            trigger.style.display = '';
          }
        });
      }

      // Initial render
      updateContent();
    });
  </script>
</body>

</html>
